<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d38"><title>통합돌봄 ON</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#17332f;font:16px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:20px}header{background:#123d38;color:white;border-radius:24px;padding:30px 24px}h1{margin:0;font-size:32px}h1 span{color:#8ce4b6}p{line-height:1.6}h2{font-size:16px;margin:28px 0 12px}.tile{display:block;text-decoration:none;color:inherit;background:white;border:1px solid #dce6e2;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 4px 14px #123d3808}.tile strong{display:block;font-size:19px;margin:6px 0}.tile small{color:#536961}.tag{font-size:12px;color:#14766a;font-weight:bold}.pending{border-style:dashed}footer{font-size:12px;color:#536961;margin:24px 0}button{font:inherit;border:0;border-radius:12px;padding:12px;background:#123d38;color:white}input{width:100%;padding:12px;margin:10px 0;border:1px solid #aabdb5;border-radius:10px;font:inherit}a:focus-visible,button:focus-visible{outline:3px solid #178c79}</style></head><body><main><header><h1>통합돌봄 <span>ON</span></h1><p>돌봄의 현장, 필요한 정보를 한곳에.</p></header><h2>현장 지원 서비스</h2><a class="tile" href="../"><span class="tag">01 · 안전</span><strong>응급병원 안내 →</strong><small>상황별 병원 · 전화 · 길찾기</small></a><a class="tile" href="https://79san2.github.io/integrated-care-seoul/"><span class="tag">02 · 기관 및 채용</span><strong>통합돌봄서비스(서울) →</strong><small>제공기관 현황 · 연락처 · 통계 · 채용공고</small></a><section class="tile pending"><span class="tag">03 · 사업지침</span><strong>통합돌봄 사업안내</strong><small id="status">기존 검색 앱 주소 연결 필요</small><p><a id="guide" hidden>사업안내 열기 →</a></p><details><summary>이 기기에서 앱 주소 설정</summary><form id="form"><label for="url">Google Apps Script 배포 주소</label><input id="url" type="url" placeholder="https://script.google.com/..." required><button>주소 저장</button></form></details></section><footer>통합돌봄 ON · 초기 통합판<br>기존 서비스의 데이터 및 갱신 체계를 그대로 이용합니다.</footer></main><script>const g=document.getElementById('guide'),u=document.getElementById('url'),s=document.getElementById('status');function show(){const v=localStorage.getItem('careGuide');if(v){g.href=v;g.hidden=false;u.value=v;s.textContent='이 기기에 연결됨'}}document.getElementById('form').onsubmit=e=>{e.preventDefault();const v=new URL(u.value);if(v.origin!=='https://script.google.com'||!v.pathname.endsWith('/exec')){alert('Apps Script 배포 주소(/exec)를 입력하세요.');return}localStorage.setItem('careGuide',v.href);show()};show();</script></body></html>
