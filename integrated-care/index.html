<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f3b">
<meta name="description" content="서울지역 최중증 발달장애인 통합돌봄서비스 기관 통합현황">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<title>통합돌봄서비스(서울)</title>
<style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color:#172d2a;background:#f4f7f6;font-synthesis:none;--green:#176b62;--deep:#123f3b;--mint:#e8f3f0;--line:#e4ebe8;--muted:#71817d;--shadow:0 8px 24px #153b3510}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}
.hero{background:linear-gradient(125deg,#123f3b,#1b7569);color:white;padding:27px max(20px,calc((100vw - 1120px)/2)) 25px}
.hero-inner{max-width:1120px;margin:auto}.brandline{display:flex;align-items:center;gap:10px}.brandmark{width:38px;height:38px;border-radius:13px;background:#ffffff20;display:grid;place-items:center;font-size:20px}.hero h1{font-size:23px;letter-spacing:-.7px;margin:0}.hero p{margin:8px 0 0;color:#d9e9e5;font-size:13px}
main{max-width:1120px;margin:auto;padding:20px 18px 44px}.topmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 15px}.install-app{border:0;border-radius:9px;background:#176b62;color:white;padding:9px 13px;font-size:12px;font-weight:750}.tag{display:inline-flex;align-items:center;border-radius:30px;background:var(--mint);color:var(--green);padding:6px 11px;font-size:11px;font-weight:750}.updated{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:white;border:1px solid var(--line);border-radius:17px;padding:16px 18px;box-shadow:var(--shadow)}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:27px;font-weight:800;letter-spacing:-1px;margin:5px 0 1px}.stat-foot{font-size:11px;color:#8b9995}
.nav{display:flex;gap:8px;margin:19px 0 20px;padding:5px;background:#e9efed;border-radius:14px}.nav button{flex:1;border:0;background:transparent;color:#61716d;border-radius:10px;padding:11px 8px;font-size:13px;font-weight:750}.nav button.active{background:white;color:var(--deep);box-shadow:0 2px 8px #173b3512}
.view{display:none}.view.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:22px 2px 12px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.4px}.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}
.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}.notice{background:#f0f6f4;border:1px solid #deebe6;border-radius:13px;padding:12px 14px;color:#526762;font-size:12px;line-height:1.65;margin:13px 0}.notice strong{color:var(--deep)}
.quickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.typecard{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.typecard .eyebrow{font-size:11px;color:var(--muted)}.typecard strong{display:block;font-size:24px;margin:6px 0 3px}.typecard small{font-size:11px;color:#81908b}
.filters{display:grid;grid-template-columns:minmax(180px,1.5fr) repeat(3,minmax(120px,1fr));gap:8px;margin:12px 0}
input,select{width:100%;border:1px solid #dce5e1;background:white;border-radius:11px;padding:11px 12px;color:#203b36;font-size:13px;outline:none}input:focus,select:focus{border-color:#4b9688;box-shadow:0 0 0 3px #176b6215}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.orgcard{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}.orgtop{display:flex;justify-content:space-between;align-items:start;gap:8px}.orgcard h3{font-size:15px;line-height:1.45;margin:0 0 5px;letter-spacing:-.25px}.status{font-size:10px;font-weight:750;padding:5px 8px;border-radius:20px;white-space:nowrap;background:#edf3f1;color:#526761}.status.official{background:#e4f3ec;color:#23734d}.status.candidate{background:#fff3df;color:#94641e}.orgmeta{font-size:11px;color:var(--muted);line-height:1.6;margin:6px 0 8px;overflow-wrap:anywhere}.addressline{display:flex;gap:7px;align-items:flex-start;background:#f4f8f6;border:1px solid #e7efeb;border-radius:10px;padding:9px 10px;margin:8px 0 12px;font-size:12px;line-height:1.55;color:#294a43;overflow-wrap:anywhere}.addressline .pin{flex:none;color:var(--green);font-weight:800}.addressline .address-text{min-width:0}.addressline .address-source{display:block;color:var(--muted);font-size:10px;margin-top:3px}.contactline{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0 4px}.contactline>div{min-width:0;background:#f4f8f6;border:1px solid #e7efeb;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.contactline strong{display:block;color:#526761;font-size:10px;font-weight:700;margin-bottom:3px}.contactline a{color:#176b53;font-weight:750;text-decoration:none}.contactline a:active{text-decoration:underline}.numbers{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.number{background:#f5f8f7;border-radius:11px;padding:10px}.number b{display:block;font-size:18px;letter-spacing:-.4px}.number span{font-size:10px;color:var(--muted)}.orgfoot{font-size:11px;color:#75847f;margin:10px 0 0;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions a,.actions button,.softbtn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #dce9e5;background:#f0f6f4;color:#176b62;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:750}.actions button{font-family:inherit}.empty{grid-column:1/-1;text-align:center;padding:34px 12px;color:var(--muted);background:white;border:1px dashed #d8e2de;border-radius:14px;font-size:13px}
.gridstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:white;border:1px solid var(--line);border-radius:14px;padding:14px}.mini h3{font-size:13px;margin:0 0 8px}.mini strong{font-size:22px}.mini p{font-size:11px;color:var(--muted);line-height:1.6;margin:5px 0 0}
.formsection{margin:0 0 17px}.formsection h3{font-size:13px;margin:0 0 10px;color:#31534d}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field label{display:block;font-size:11px;color:#61716c;margin:0 0 6px;font-weight:650}.field.full{grid-column:1/-1}.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btn{border:1px solid #dce5e1;border-radius:10px;padding:10px 13px;background:white;color:#35524c;font-size:12px;font-weight:750}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.danger{color:#a13e3e}.manageitem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:12px;padding:12px}.manageitem h4{font-size:13px;margin:0 0 4px}.manageitem p{font-size:11px;color:var(--muted);margin:0}.manageitem .actions{margin:0}
.small{font-size:11px;color:var(--muted);line-height:1.65}.hidden{display:none!important}footer{text-align:center;padding:25px 10px 0;color:#899691;font-size:10px}
@media(max-width:760px){main{padding:15px 13px 35px}.hero{padding:22px 17px}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.cards{grid-template-columns:1fr}.quickgrid{gap:8px}.typecard{padding:12px}.typecard strong{font-size:21px}.stat{padding:13px}.stat-value{font-size:23px}.gridstats{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.stats{gap:7px}.stat{padding:11px 9px}.stat-label{font-size:10px}.stat-value{font-size:20px}.stat-foot{font-size:9px}.nav button{font-size:11px;padding:10px 3px}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.topmeta{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><div class="brandline"><div class="brandmark">⌂</div><h1>통합돌봄서비스(서울)</h1></div><p>서울지역 최중증 발달장애인 통합돌봄서비스 기관 정보와 운영현황</p></div></header>
<main>
<div class="topmeta"><span class="tag">서울 제공기관 통합현황</span><span class="updated" id="updated">자료 확인일 확인 중</span><button id="installApp" class="install-app" hidden type="button">앱 설치</button></div>
<nav class="nav" aria-label="주요 메뉴">
 <button class="active" data-view="directory">기관 찾기</button><button data-view="statistics">통계</button>
</nav>

<section class="view active" id="directory">
 <div class="section-head"><div><h2>기관 찾기</h2><p id="resultCount">기관 정보를 검색하고 연락처와 위치를 확인합니다.</p></div></div>
 <div class="filters"><input id="search" placeholder="기관명·주소·자치구 검색"><select id="type"><option value="">전체 서비스 유형</option><option>24시간형</option><option>주간 개별 1:1</option><option>주간 그룹 1:1</option></select><select id="district"><option value="">서울 전체 자치구</option></select><select id="sort"><option value="name">기관명순</option><option value="district">자치구순</option></select></div>
 <div class="cards" id="orgList"></div>
</section>
<section class="view" id="statistics">
 <div class="section-head"><div><h2>운영현황 통계</h2><p>앱 등록자료와 공식 발표자료를 구분해 표시합니다.</p></div></div>
 <div class="gridstats" id="typeStats"></div>
 <div class="section-head"><div><h2>자치구별 등록 현황</h2><p>기관 등록 수와 확인된 이용인 수치</p></div></div>
 <div class="gridstats" id="districtStats"></div>
 <div class="section-head"><div><h2>공식 참고자료</h2><p>기준일이 다른 자료는 별도로 확인하세요.</p></div></div>
 <div id="officialSources" class="panel small"></div>
 <div class="section-head"><div><h2>서울지역센터 담당 연락처</h2><p>서비스 문의 권역별 연락처</p></div></div>
 <div id="supportContacts" class="cards"></div>
</section>

<footer>통합돌봄서비스(서울) · 기관 정보는 확인일과 출처를 함께 관리합니다.</footer>
</main>
<script>
const districts=['자치구 확인 필요','강남구','강동구','강북구','강서구','관악구','광진구','구로구','금천구','노원구','도봉구','동대문구','동작구','마포구','서대문구','서초구','성동구','성북구','송파구','양천구','영등포구','용산구','은평구','종로구','중구','중랑구'];
const $=s=>document.querySelector(s);let records=[],baseRecords=[],editing=null,officialSnapshot=null,latestOfficialStatus=null,supportContacts=[],latestProviderDirectory=null;
const cleanRecord=r=>{const x={...r};delete x.staffVacancy;delete x.userWaiting;return x};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function val(v){return v===undefined||v===null||v===''?'미확인':Number(v).toLocaleString('ko-KR')}
function total(key,arr=records){const a=arr.map(r=>r[key]).filter(v=>v!==''&&v!==undefined&&v!==null);return a.length?a.reduce((s,v)=>s+Number(v),0).toLocaleString('ko-KR'):'—'}
function sum(arr,key){return total(key,arr)}
function tel(s){return String(s||'').replace(/[^0-9+]/g,'')}
function mapUrl(r){return r.naverMapUrl||('https://map.naver.com/p/search/'+encodeURIComponent(r.name))}
function level(r){return r.verificationLevel==='official_directory'?['공식 목록 확인','official']:r.verificationLevel==='candidate'?['추가 확인 필요','candidate']:r.verificationLevel==='operating_evidence'?['운영 근거 확인','']:['확인 수준 미분류','']}
function setup(){['#district','#formDistrict'].forEach(sel=>{const el=$(sel);if(el)districts.forEach(d=>el.add(new Option(d,d)))})}
function saveLocal(){localStorage.setItem('careSeoulRecords',JSON.stringify(records.map(cleanRecord)));render()}
function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.goto)));
function card(r,manage=false){const lv=level(r),base=baseRecords.find(x=>x.id===r.id)||baseRecords.find(x=>x.name===r.name),rawAddress=String(r.address||'').trim(),addr=(rawAddress&&rawAddress!=='주소 미등록'?rawAddress:(base&&base.address?base.address:'주소 미등록')),addrSource=r.addressSource||(base&&base.addressSource)||'';return '<article class="orgcard"><div class="orgtop"><h3>'+esc(r.name)+'</h3><span class="status '+lv[1]+'">'+lv[0]+'</span></div><div class="orgmeta">'+esc(r.district||'자치구 미확인')+' · '+esc(r.type||'유형 미확인')+'</div><div class="addressline"><span class="pin">⌖</span><span class="address-text"><strong>주소</strong> · '+esc(addr)+(addrSource?'<span class="address-source">주소 출처: '+esc(addrSource)+'</span>':'')+'</span></div><div class="numbers"><div class="number"><b>'+val(r.userCapacity)+'</b><span>이용인 정원</span></div><div class="number"><b>'+val(r.userCurrent)+'</b><span>이용인 현원</span></div><div class="number"><b>'+val(r.staffCapacity)+'</b><span>종사자 정원</span></div><div class="number"><b>'+val(r.staffCurrent)+'</b><span>종사자 현원</span></div></div><div class="contactline"><div><strong>대표번호</strong><span>'+(r.phone?'<a href="tel:'+tel(r.phone)+'">'+esc(r.phone)+'</a>':'미확인')+'</span></div><div><strong>'+esc(r.teamName||"통합돌봄 담당팀")+'</strong><span>'+(r.teamPhone?'<a href="tel:'+tel(r.teamPhone)+'">'+esc(r.teamPhone)+'</a>':'미확인')+'</span></div><div><strong>담당자·팀장 직통번호</strong><span>'+(r.direct?'<a href="tel:'+tel(r.direct)+'">'+esc(r.direct)+'</a>':'미확인')+'</span></div></div><p class="orgfoot">담당자 '+esc(r.manager||'미등록')+' · 확인일 '+esc(r.verified||'미등록')+'</p><div class="actions">'+'<a target="_blank" rel="noopener" href="'+esc(mapUrl(r))+'">네이버 지도</a>'+(manage?'<button type="button" onclick="editRecord(\''+esc(r.id)+'\')">수정</button><button type="button" onclick="deleteRecord(\''+esc(r.id)+'\')">삭제</button>':'')+'</div><p class="orgfoot">'+esc(r.status||'운영 확인 상태 미기재')+(r.source?' · 출처 '+esc(r.source):'')+(r.sourceUrl?' · <a target="_blank" rel="noopener" href="'+esc(r.sourceUrl)+'">원문</a>':'')+'</p></article>'}
function render(){
 const dates=records.map(r=>r.verified).filter(Boolean).sort();$('#updated').textContent='자료 확인일 '+(dates.at(-1)||window.datasetLastChecked||'미등록');
 const types=['24시간형','주간 개별 1:1','주간 그룹 1:1'];
 const q=($('#search')?.value||'').toLowerCase(),t=$('#type')?.value||'',d=$('#district')?.value||'',sort=$('#sort')?.value||'name';const arr=records.filter(r=>(!q||[r.name,r.district,r.address].join(' ').toLowerCase().includes(q))&&(!t||r.type===t)&&(!d||r.district===d)).sort((a,b)=>String(a[sort]||'').localeCompare(String(b[sort]||''),'ko'));$('#orgList').innerHTML=arr.length?arr.map(r=>card(r)).join(''):'<div class="empty">검색 조건에 맞는 기관이 없습니다.</div>';$('#resultCount').textContent='검색 결과 '+arr.length+'개 기관';
 $('#typeStats').innerHTML=types.map(t=>{const a=records.filter(r=>r.type===t);const official=a.filter(r=>r.verificationLevel==='official_directory').length,evidence=a.filter(r=>r.verificationLevel==='operating_evidence').length,candidate=a.filter(r=>r.verificationLevel==='candidate').length;return '<div class="mini"><h3>'+t+'</h3><strong>'+a.length+'개소</strong><p>공식 목록 확인 '+official+' · 운영 근거 확인 '+evidence+' · 추가 확인 '+candidate+'<br>이용인 정원 '+sum(a,'userCapacity')+'명 · 현원 '+sum(a,'userCurrent')+'명</p></div>'}).join('');
 $('#districtStats').innerHTML=districts.filter(x=>x!=='자치구 확인 필요').map(d=>{const a=records.filter(r=>r.district===d);return a.length?'<div class="mini"><h3>'+d+'</h3><strong>'+a.length+'개소</strong><p>이용인 정원 '+sum(a,'userCapacity')+'명 · 현원 '+sum(a,'userCurrent')+'명</p></div>':''}).join('');
 const old=officialSnapshot&&officialSnapshot.weeklyIndividualProviders?'<p><strong>'+esc(officialSnapshot.reportedDate||'과거 기준')+' 서울시의회 자료</strong><br>주간 개별형 '+esc(officialSnapshot.weeklyIndividualProviders)+'개소 · 이용자 '+esc(officialSnapshot.weeklyIndividualUsers??'미확인')+'명</p>':'';
 const latest=latestOfficialStatus?'<p><strong>'+esc(latestOfficialStatus.reportedDate||'최근 공개')+' 한국장애인개발원 발표</strong><br>서울 전체 3개 유형 합계 '+esc(latestOfficialStatus.seoulAllTypesProviderCount)+'개소 · 이용인 '+esc(latestOfficialStatus.seoulAllTypesServiceUsers)+'명</p>':'';
 const directory=latestProviderDirectory?'<p><strong>'+esc(latestProviderDirectory.publishedDate||'제공기관 목록')+'</strong><br>'+esc(latestProviderDirectory.sourceTitle||'공식 제공기관 목록')+' · '+esc(latestProviderDirectory.status||'목록 확인 필요')+'</p>':'';
 $('#officialSources').innerHTML=(old+latest+directory)||'공식 참고자료가 없습니다.';
 $('#supportContacts').innerHTML=supportContacts.map(c=>'<article class="orgcard"><h3>'+esc((c.districts||[]).join(' · '))+'</h3><div class="orgmeta">'+esc(c.role||'서울지역센터 문의')+'</div><div class="actions"><a href="tel:'+tel(c.phone)+'">'+esc(c.phone)+'</a></div></article>').join('');
}
['#search','#type','#district','#sort'].forEach(s=>$(s).addEventListener('input',render));
setup();
(async()=>{let loaded=null,lastError=null;for(const url of ['./data.json?build=20261115n','/emergency-hospital/integrated-care/data.json?build=20261115n']){try{const response=await fetch(url,{cache:'reload'});if(!response.ok)throw Error('자료 요청 실패('+response.status+')');const data=await response.json();if(!Array.isArray(data.records)||data.records.length===0)throw Error('기관자료가 비어 있습니다.');loaded=data;break}catch(e){lastError=e}}if(!loaded)throw(lastError||Error('기관자료 연결 실패'));window.datasetLastChecked=loaded.lastChecked||'';officialSnapshot=loaded.officialSnapshot||null;latestOfficialStatus=loaded.latestOfficialStatus||null;latestProviderDirectory=loaded.latestProviderDirectory||null;supportContacts=loaded.seoulSupportContacts||[];baseRecords=loaded.records.map(cleanRecord);records=baseRecords;render();})().catch(error=>{records=[];render();$('#resultCount').textContent='기관정보 연결 확인 필요';$('#orgList').innerHTML='<div class="empty">기관정보를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요. ('+esc(error&&error.message?error.message:'자료 연결 오류')+')</div>'});
 // 앱 설치 및 오프라인 실행 지원
 let careSeoulInstallPrompt=null;
 const installButton=document.getElementById('installApp');
 window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  careSeoulInstallPrompt=event;
  if(installButton)installButton.hidden=false;
 });
 if(installButton)installButton.addEventListener('click',async()=>{
  if(!careSeoulInstallPrompt){
   alert('크롬 오른쪽 위 ⋮ 메뉴에서 “앱 설치” 또는 “홈 화면에 추가”를 선택해 주세요.');
   return;
  }
  careSeoulInstallPrompt.prompt();
  await careSeoulInstallPrompt.userChoice;
  careSeoulInstallPrompt=null;
  installButton.hidden=true;
 });
 window.addEventListener('appinstalled',()=>{if(installButton)installButton.hidden=true});
 if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{}));
 }

</script>
</body>
</html>
